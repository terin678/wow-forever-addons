# Pushing a tag such as rendertuner-v0.4.0 or keel-v0.14.0 tests the addons, zips the one
# the tag names, and publishes the zip to GitHub, CurseForge and Wago. Docs/releasing.md has
# the one-time setup.
#
# A version with -alpha or -beta in it (keel-v0.15.0-beta.1) is published as that on each
# store and as a pre-release on GitHub, so it reaches only those who ask for it.
#
# Run by hand (Actions, Run workflow, or gh workflow run) it publishes a tag that is already
# there: for a release that got part of the way. The workflow is then read from the branch
# it is run on and the addon from the tag, so a fault in the workflow can be mended on main
# without moving the tag.
name: Release

on:
  push:
    tags: ["rendertuner-v*", "keel-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to publish, such as rendertuner-v0.6.0 or keel-v0.14.0
        required: true
      curseforge:
        description: Upload to CurseForge
        type: boolean
        default: true
      wago:
        description: Upload to Wago
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      CF_GAME_VERSION_IDS: ${{ vars.CF_GAME_VERSION_IDS }}
      CF_GAME_VERSION: ${{ vars.CF_GAME_VERSION }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Which addon, and the tag and its TOC agree
        env:
          RENDERTUNER_CF: ${{ vars.CF_PROJECT_ID }}
          RENDERTUNER_WAGO: ${{ vars.WAGO_PROJECT_ID }}
          KEEL_CF: ${{ vars.KEEL_CF_PROJECT_ID }}
          KEEL_WAGO: ${{ vars.KEEL_WAGO_PROJECT_ID }}
        # One row per addon: its folder, what goes in the zip, and its project on each store.
        run: |
          case "$TAG" in
            rendertuner-v*) addon=RenderTuner; folders="RenderTuner Keel"; cf="$RENDERTUNER_CF"; wago="$RENDERTUNER_WAGO" ;;
            keel-v*)        addon=Keel;        folders="Keel";             cf="$KEEL_CF";        wago="$KEEL_WAGO" ;;
            *) echo "no addon is released by a tag named $TAG"; exit 1 ;;
          esac
          version="${TAG#*-v}"
          toc=$(sed -n 's/^## Version:[[:space:]]*//p' "AddonProjects/forever/$addon/$addon.toc" | tr -d '\r')
          [ "$version" = "$toc" ] || { echo "tag says $version, $addon.toc says $toc"; exit 1; }
          case "$version" in *-alpha*) channel=alpha ;; *-beta*) channel=beta ;; *) channel=release ;; esac
          # A .toc that names a CurseForge project it requires ships there alone, with that
          # project as a required dependency. The other stores cannot carry a dependency, so
          # their zip keeps everything in `folders`.
          requires=$(sed -n 's/^## X-CurseForge-Requires:[[:space:]]*//p' "AddonProjects/forever/$addon/$addon.toc" | tr -d '\r')
          # A stable release that leaves Keel to CurseForge needs a stable Keel there to fetch.
          git fetch --tags --force --quiet
          if [ -n "$requires" ] && [ "$channel" = release ] && ! git tag -l 'keel-v*' | grep -Evq -- '-(alpha|beta)'; then
            echo "a stable $addon without Keel inside needs a stable keel-v tag first"; exit 1
          fi
          {
            echo "ADDON=$addon"
            echo "FOLDERS=$folders"
            echo "VERSION=$version"
            echo "CHANNEL=$channel"
            echo "REQUIRES=$requires"
            echo "CF_PROJECT_ID=$cf"
            echo "WAGO_PROJECT_ID=$wago"
          } >> "$GITHUB_ENV"

      - name: Lint and test
        run: |
          sudo apt-get install -y luajit
          python3 scripts/lint.py
          for addon in Keel RenderTuner; do luajit scripts/test-harness.lua "AddonProjects/forever/$addon"; done

      - name: Zip
        run: |
          zip="$ADDON-$VERSION-forever.zip"
          (cd AddonProjects/forever && zip -rq "$GITHUB_WORKSPACE/$zip" $FOLDERS)
          echo "ZIP=$zip" >> "$GITHUB_ENV"
          # CurseForge's zip: the addon alone when it names what it requires there.
          cfzip="$zip"
          if [ -n "$REQUIRES" ]; then
            cfzip="$ADDON-$VERSION-curseforge.zip"
            (cd AddonProjects/forever && zip -rq "$GITHUB_WORKSPACE/$cfzip" "$ADDON")
          fi
          echo "CF_ZIP=$cfzip" >> "$GITHUB_ENV"
          # The tag's message is the changelog; fetching again keeps an annotated tag's text.
          git fetch --tags --force --quiet
          notes=$(git for-each-ref "refs/tags/$TAG" --format='%(contents)')
          printf '%s\n' "${notes:-$ADDON $VERSION}" > notes.md

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # A release that is already there, from a run that got this far, is left as it is.
        run: |
          gh release view "$TAG" > /dev/null 2>&1 \
            || gh release create "$TAG" "$ZIP" --title "$ADDON $VERSION" --notes-file notes.md \
                 $([ "$CHANNEL" = release ] || echo --prerelease)

      - name: CurseForge
        if: ${{ env.CF_API_TOKEN != '' && (github.event_name == 'push' || inputs.curseforge) }}
        run: |
          [ -n "$CF_PROJECT_ID" ] || { echo "$ADDON has no CurseForge project id set; skipped"; exit 0; }
          # The game version is found by its name, 1.60.1, unless CF_GAME_VERSION_IDS says which ids.
          ids="$CF_GAME_VERSION_IDS"
          if [ -z "$ids" ]; then
            versions=$(curl -fsS -H "X-Api-Token: $CF_API_TOKEN" https://wow.curseforge.com/api/game/versions)
            ids=$(jq -r --arg n "${CF_GAME_VERSION:-1.60.1}" '[.[] | select(.name == $n) | .id] | join(",")' <<< "$versions")
            case "$ids" in
              ""|*,*) echo "Wanted exactly one CurseForge game version named ${CF_GAME_VERSION:-1.60.1}, found: '$ids'. Candidates:"
                      jq -r '.[] | select(.name | test("forever|1\\.60|camelot"; "i")) | "\(.id) \(.name)"' <<< "$versions"
                      exit 1 ;;
            esac
          fi
          meta=$(jq -n --rawfile c notes.md --arg n "$ADDON $VERSION" --argjson g "[$ids]" --arg t "$CHANNEL" --arg r "$REQUIRES" \
            '{changelog: $c, changelogType: "markdown", displayName: $n, gameVersions: $g, releaseType: $t}
             + (if $r == "" then {} else {relations: {projects: [{slug: $r, type: "requiredDependency"}]}} end)')
          # --form-string, not -F: -F cuts a value at its first semicolon, and a changelog has them.
          curl --fail-with-body -sS -H "X-Api-Token: $CF_API_TOKEN" --form-string "metadata=$meta" -F "file=@$CF_ZIP" \
            "https://wow.curseforge.com/api/projects/$CF_PROJECT_ID/upload-file"

      - name: Wago
        # Runs once there is a zip, whatever CurseForge said: one store's refusal is not the other's.
        if: ${{ !cancelled() && env.ZIP != '' && env.WAGO_API_TOKEN != '' && (github.event_name == 'push' || inputs.wago) }}
        run: |
          [ -n "$WAGO_PROJECT_ID" ] || { echo "$ADDON has no Wago project id set; skipped"; exit 0; }
          meta=$(jq -n --rawfile c notes.md --arg l "$VERSION" --arg s "$([ "$CHANNEL" = release ] && echo stable || echo "$CHANNEL")" \
            '{label: $l, stability: $s, changelog: $c, supported_forever_patch: "1.60.1"}')
          curl --fail-with-body -sS -H "Authorization: Bearer $WAGO_API_TOKEN" -H "Accept: application/json" \
            --form-string "metadata=$meta" -F "file=@$ZIP" "https://addons.wago.io/api/projects/$WAGO_PROJECT_ID/version"
